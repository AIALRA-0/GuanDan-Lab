server {
    listen 80;
    listen [::]:80;
    server_name guandan.aialra.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name guandan.aialra.online;

    ssl_certificate /etc/letsencrypt/live/guandan.aialra.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guandan.aialra.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /srv/aialra/config/nginx/snippets/aialra-hsts.conf;
    include /srv/aialra/config/nginx/snippets/aialra-auth-endpoints.conf;
    include /srv/aialra/config/nginx/snippets/aialra-auth-protect.conf;

    client_max_body_size 128k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location / {
        include /srv/aialra/config/nginx/snippets/aialra-auth-identity-headers.conf;
        proxy_pass http://127.0.0.1:13100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
